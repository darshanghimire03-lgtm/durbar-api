<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durbar Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4f5f7;
    color: #1c1e21;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #777; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccd0d5;
    border-radius: 8px;
    font-size: 15px;
  }
  input:focus { outline: 2px solid #1a73e8; border-color: transparent; }
  .pass { position: relative; }
  .pass input { padding-right: 64px; }
  .toggle {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    color: #1a73e8;
    padding: 6px 8px;
    font-size: 13px;
    width: auto;
    margin: 0;
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #1a73e8;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  button.secondary { background: #e4e6eb; color: #1c1e21; }
  .msg { font-size: 13px; margin-top: 12px; min-height: 18px; word-break: break-word; }
  .err { color: #c5221f; }
  .ok { color: #137333; }
  .hint { font-size: 12px; color: #888; margin-top: 14px; text-align: center; }
  .hidden { display: none; }
  .profile { text-align: center; }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    background: #e4e6eb;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #777;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-size: 20px; font-weight: 600; }
  .role {
    display: inline-block;
    margin: 6px 0 14px;
    padding: 3px 10px;
    border-radius: 12px;
    background: #e8f0fe;
    color: #1a73e8;
    font-size: 12px;
    text-transform: capitalize;
  }
  .rows { text-align: left; border-top: 1px solid #eee; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .row span:first-child { color: #777; }
  .row span:last-child { text-align: right; word-break: break-all; }
</style>
</head>
<body>
<div class="card">

  <div id="loginView">
    <h1>Login</h1>
    <p class="sub">Sign in with your Gmail and password</p>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="name@gmail.com" autocomplete="username" inputmode="email">

    <label for="password">Password</label>
    <div class="pass">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button type="button" class="toggle" id="toggle">Show</button>
    </div>

    <button id="submit">Login</button>
    <div class="msg" id="msg"></div>
    <div class="hint">Server: <span id="serverLabel"></span></div>
  </div>

  <div id="profileView" class="hidden profile">
    <div class="avatar" id="avatar"></div>
    <div class="name" id="pName"></div>
    <div class="role" id="pRole"></div>
    <div class="rows" id="pRows"></div>
    <button class="secondary" id="logout">Logout</button>
  </div>

</div>

<script>
  const BASE = "https://durbar-api-1.onrender.com";
  const STORE = "durbar_user";

  const loginView = document.getElementById("loginView");
  const profileView = document.getElementById("profileView");
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  const toggleEl = document.getElementById("toggle");
  const submitEl = document.getElementById("submit");
  const msgEl = document.getElementById("msg");
  const logoutEl = document.getElementById("logout");

  document.getElementById("serverLabel").textContent = BASE;

  function setMsg(text, cls) {
    msgEl.textContent = text;
    msgEl.className = "msg" + (cls ? " " + cls : "");
  }

  function isHttps(url) {
    try {
      return new URL(url).protocol === "https:";
    } catch (e) {
      return false;
    }
  }

  function addRow(parent, label, value) {
    if (value === undefined || value === null || value === "") return;
    const row = document.createElement("div");
    row.className = "row";
    const a = document.createElement("span");
    a.textContent = label;
    const b = document.createElement("span");
    b.textContent = String(value);
    row.append(a, b);
    parent.append(row);
  }

  function showProfile(user) {
    const avatar = document.getElementById("avatar");
    avatar.innerHTML = "";
    if (user.profileImageUrl && isHttps(user.profileImageUrl)) {
      const img = document.createElement("img");
      img.src = user.profileImageUrl;
      img.alt = "";
      img.onerror = () => {
        avatar.textContent = (user.fullName || "?").charAt(0).toUpperCase();
      };
      avatar.append(img);
    } else {
      avatar.textContent = (user.fullName || "?").charAt(0).toUpperCase();
    }

    document.getElementById("pName").textContent = user.fullName || "";
    document.getElementById("pRole").textContent = user.role || "";

    const rows = document.getElementById("pRows");
    rows.innerHTML = "";
    addRow(rows, "UID", user.uid);
    addRow(rows, "Email", user.email);
    addRow(rows, "Phone", user.phone);
    addRow(rows, "Gender", user.gender);
    if (user.role === "professor") {
      addRow(rows, "Subject", user.assignedSubject);
    } else {
      addRow(rows, "Class", user.classLevel);
      addRow(rows, "Section", user.section);
    }
    if (user.createdAt) addRow(rows, "Joined", new Date(user.createdAt).toLocaleDateString());

    loginView.classList.add("hidden");
    profileView.classList.remove("hidden");
  }

  function showLogin() {
    profileView.classList.add("hidden");
    loginView.classList.remove("hidden");
    passEl.value = "";
    setMsg("", "");
  }

  async function doLogin() {
    const email = emailEl.value.trim().toLowerCase();
    const password = passEl.value;

    if (!email || !password) {
      setMsg("Enter email and password", "err");
      return;
    }
    if (!/^[a-z0-9._%+\-]+@gmail\.com$/.test(email)) {
      setMsg("Only @gmail.com emails are accepted", "err");
      return;
    }

    submitEl.disabled = true;
    setMsg("Signing in... (first request may take up to a minute)", "");

    try {
      const res = await fetch(BASE + "/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        setMsg(data.detail || "Login failed (" + res.status + ")", "err");
      } else {
        try {
          localStorage.setItem(STORE, JSON.stringify(data));
        } catch (e) {}
        showProfile(data);
      }
    } catch (e) {
      setMsg("Cannot reach server. Check your connection and try again.", "err");
    }

    submitEl.disabled = false;
  }

  toggleEl.onclick = () => {
    const hidden = passEl.type === "password";
    passEl.type = hidden ? "text" : "password";
    toggleEl.textContent = hidden ? "Hide" : "Show";
  };

  submitEl.onclick = doLogin;

  [emailEl, passEl].forEach((el) => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  });

  logoutEl.onclick = () => {
    try {
      localStorage.removeItem(STORE);
    } catch (e) {}
    showLogin();
  };

  (function restore() {
    try {
      const saved = localStorage.getItem(STORE);
      if (saved) showProfile(JSON.parse(saved));
    } catch (e) {}
  })();
</script>
</body>
</html>
