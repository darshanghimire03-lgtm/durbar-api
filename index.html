<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durbar Test</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --card:#fff; --text:#1d2129; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b22; --text:#e8eaed; --muted:#9aa0aa; --line:#2a2e38; --accent:#60a5fa; --danger:#f87171; --ok:#4ade80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:17px; margin:0 0 10px; }
  input, button { font:inherit; }
  input[type=text], input[type=email], input[type=password], input[type=url] {
    width:100%; padding:10px 12px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--text);
  }
  button { cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--text); padding:7px 12px; border-radius:8px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  button.on { color:var(--danger); border-color:var(--danger); }
  button.del { color:var(--danger); }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .bar .who { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; }
  .tabs button { flex:1; white-space:nowrap; }
  .tabs button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .meta { color:var(--muted); font-size:13px; }
  .text { white-space:pre-wrap; word-break:break-word; margin:8px 0; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:6px; margin:8px 0; }
  .imgs img { width:100%; border-radius:8px; display:block; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .comments { margin-top:12px; border-top:1px solid var(--line); padding-top:12px; }
  .comment { padding:8px 0; border-bottom:1px solid var(--line); }
  .comment:last-of-type { border-bottom:0; }
  .comment .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  .comment img { max-width:200px; border-radius:8px; display:block; margin-top:6px; }
  .send { display:flex; gap:8px; margin-top:10px; }
  .send input { margin:0; flex:1; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin:4px 0; }
  .empty { text-align:center; color:var(--muted); padding:20px; }
  .hidden { display:none; }
  .center { text-align:center; }
  .avatar { width:84px; height:84px; border-radius:50%; object-fit:cover; background:var(--line); display:block; margin:0 auto 12px; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .kv:last-child { border-bottom:0; }
  .kv span:first-child { color:var(--muted); }
  .kv span:last-child { text-align:right; word-break:break-all; }
  video { width:100%; max-height:70vh; border-radius:8px; background:#000; display:block; }
  .subject { display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:8px; padding:12px 14px; text-align:left; }
  .opt { display:block; width:100%; text-align:left; margin-top:8px; padding:10px 12px; }
  .opt.right { border-color:var(--ok); color:var(--ok); }
  .opt.wrong { border-color:var(--danger); color:var(--danger); }
  .score { position:sticky; top:0; z-index:1; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="card">
    <h1>Login</h1>
    <input id="base" type="url" placeholder="API base URL" autocomplete="off">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <div id="loginErr" class="err"></div>
    <button id="loginBtn" class="primary">Log in</button>
  </div>

  <div id="appView" class="hidden">
    <div class="bar">
      <div class="who" id="who"></div>
      <button id="logoutBtn">Log out</button>
    </div>

    <div class="tabs" id="tabs">
      <button data-tab="profile">Profile</button>
      <button data-tab="feed">Feed</button>
      <button data-tab="shorts">Shorts</button>
      <button data-tab="mock">Mock</button>
    </div>

    <section id="tab-profile" class="hidden"></section>

    <section id="tab-feed" class="hidden">
      <div id="feedErr" class="err"></div>
      <div id="feed"></div>
      <div class="center"><button id="feedMore" class="hidden">Load more</button></div>
    </section>

    <section id="tab-shorts" class="hidden">
      <div id="shortsErr" class="err"></div>
      <div id="shorts"></div>
      <div class="center"><button id="shortsMore" class="hidden">Load more</button></div>
    </section>

    <section id="tab-mock" class="hidden">
      <div id="mockErr" class="err"></div>
      <div id="mockList"></div>
      <div id="mockQuiz" class="hidden"></div>
    </section>
  </div>

</div>

<script>
const DEFAULT_BASE = "https://durbar-api-1.onrender.com";
const $ = (id) => document.getElementById(id);
const state = { base: "", email: "", password: "", user: null, feedNext: null, shortsNext: null, loaded: {} };

function store(key, value) {
  try { value === null ? sessionStorage.removeItem(key) : sessionStorage.setItem(key, value); } catch (e) {}
}
function load(key) {
  try { return sessionStorage.getItem(key); } catch (e) { return null; }
}

async function api(method, path, body) {
  const headers = { "X-Email": state.email, "X-Password": state.password };
  const opts = { method, headers };
  if (body !== undefined) {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(state.base + path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401) { logout(); }
    const d = data && data.detail;
    throw new Error(typeof d === "string" ? d : "Request failed (" + res.status + ")");
  }
  return data;
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props || {});
  kids.flat().forEach((k) => n.append(k));
  return n;
}

function when(ms) {
  return ms ? new Date(ms).toLocaleString() : "";
}

function short(uid) {
  return uid ? "user " + uid.slice(0, 6) : "unknown";
}

async function login() {
  const base = $("base").value.trim().replace(/\/+$/, "");
  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  $("loginErr").textContent = "";
  if (!base || !email || !password) { $("loginErr").textContent = "Fill in all fields"; return; }
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "Logging in... (server may be waking up)";
  try {
    const res = await fetch(base + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const d = data && data.detail;
      throw new Error(typeof d === "string" ? d : "Login failed (" + res.status + ")");
    }
    state.base = base; state.email = email; state.password = password; state.user = data;
    store("base", base); store("email", email); store("password", password);
    store("user", JSON.stringify(data));
    $("password").value = "";
    showApp();
  } catch (e) {
    $("loginErr").textContent = e.message === "Failed to fetch" ? "Cannot reach the server" : e.message;
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "Log in";
  }
}

function resetData() {
  state.feedNext = null; state.shortsNext = null; state.loaded = {};
  ["feed", "shorts", "mockList", "tab-profile"].forEach((id) => $(id).replaceChildren());
  $("mockQuiz").replaceChildren();
  $("mockQuiz").classList.add("hidden");
  $("mockList").classList.remove("hidden");
  ["feedErr", "shortsErr", "mockErr"].forEach((id) => { $(id).textContent = ""; });
  $("feedMore").classList.add("hidden");
  $("shortsMore").classList.add("hidden");
}

function logout() {
  ["base", "email", "password", "user"].forEach((k) => store(k, null));
  state.email = ""; state.password = ""; state.user = null;
  resetData();
  document.querySelectorAll("video").forEach((v) => v.pause());
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
}

function showApp() {
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("who").textContent = (state.user.fullName || state.user.email) + " (" + state.user.role + ")";
  resetData();
  openTab("feed");
}

function openTab(name) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  ["profile", "feed", "shorts", "mock"].forEach((t) => $("tab-" + t).classList.toggle("hidden", t !== name));
  document.querySelectorAll("video").forEach((v) => v.pause());
  if (state.loaded[name]) return;
  state.loaded[name] = true;
  if (name === "profile") renderProfile();
  if (name === "feed") loadFeed(true);
  if (name === "shorts") loadShorts(true);
  if (name === "mock") loadSubjects();
}

/* ---------- Profile ---------- */

function renderProfile() {
  const u = state.user;
  const box = $("tab-profile");
  const card = el("div", { className: "card" });
  if (u.profileImageUrl) card.append(el("img", { className: "avatar", src: u.profileImageUrl, alt: "" }));
  card.append(el("h2", { className: "center", textContent: u.fullName || u.email }));
  const rows = [
    ["Role", u.role],
    ["Email", u.email],
    ["Phone", u.phone],
    ["Gender", u.gender],
    ["Assigned subject", u.assignedSubject],
    ["Class", u.classLevel],
    ["Section", u.section],
    ["Joined", when(u.createdAt)],
    ["User ID", u.uid],
  ];
  rows.forEach(([k, v]) => {
    if (v) card.append(el("div", { className: "kv" }, el("span", { textContent: k }), el("span", { textContent: String(v) })));
  });
  box.append(card);
}

/* ---------- Feed ---------- */

async function loadFeed(first) {
  $("feedErr").textContent = "";
  $("feedMore").disabled = true;
  try {
    const q = "?limit=10" + (!first && state.feedNext ? "&before=" + state.feedNext : "");
    const data = await api("GET", "/posts" + q);
    data.posts.forEach((p) => $("feed").append(postCard(p)));
    if (first && data.posts.length === 0) $("feed").append(el("div", { className: "empty", textContent: "No posts yet" }));
    state.feedNext = data.nextBefore;
    $("feedMore").classList.toggle("hidden", !state.feedNext);
  } catch (e) {
    $("feedErr").textContent = e.message;
    if (first) state.loaded.feed = false;
  } finally {
    $("feedMore").disabled = false;
  }
}

function postCard(p) {
  const card = el("div", { className: "card" });
  const likeBtn = el("button", {});
  const cBtn = el("button", {});
  const box = el("div", { className: "comments hidden" });
  let loaded = false;
  let count = p.commentCount;

  const paintLike = () => {
    likeBtn.textContent = "\u2665 " + p.likeCount;
    likeBtn.className = p.likedByMe ? "on" : "";
  };
  const paintCount = () => { cBtn.textContent = "Comments (" + count + ")"; };
  paintLike(); paintCount();

  likeBtn.onclick = async () => {
    likeBtn.disabled = true;
    try {
      const r = await api(p.likedByMe ? "DELETE" : "PUT", "/posts/" + p.postId + "/like");
      p.likedByMe = r.liked; p.likeCount = r.likeCount; paintLike();
    } catch (e) { alert(e.message); }
    likeBtn.disabled = false;
  };

  cBtn.onclick = async () => {
    box.classList.toggle("hidden");
    if (!loaded && !box.classList.contains("hidden")) {
      loaded = true;
      await buildComments(box, p, (n) => { count = n; paintCount(); });
    }
  };

  const actions = el("div", { className: "actions" }, likeBtn, cBtn);
  if (p.authorUid === state.user.uid) {
    actions.append(el("button", {
      className: "del", textContent: "Delete",
      onclick: async () => {
        if (!confirm("Delete this post?")) return;
        try { await api("DELETE", "/posts/" + p.postId); card.remove(); } catch (e) { alert(e.message); }
      },
    }));
  }

  card.append(el("div", { className: "meta", textContent: (p.authorEmail || short(p.authorUid)) + " \u00b7 " + when(p.createdAt) + (p.privacy === "section" ? " \u00b7 Section " + p.section : "") }));
  if (p.text) card.append(el("div", { className: "text", textContent: p.text }));
  if (p.imageUrls && p.imageUrls.length) {
    card.append(el("div", { className: "imgs" }, p.imageUrls.map((u) => el("img", { src: u, loading: "lazy", alt: "" }))));
  }
  card.append(actions, box);
  return card;
}

async function buildComments(box, p, setCount) {
  const list = el("div", {});
  const err = el("div", { className: "err" });
  const input = el("input", { type: "text", placeholder: "Write a comment...", maxLength: 1000 });
  const send = el("button", { className: "primary", textContent: "Send" });
  const form = el("div", { className: "send" }, input, send);
  box.append(list, err, form);

  let n = 0;
  const add = (c) => {
    n++; setCount(n);
    list.append(commentRow(c, p, () => { n--; setCount(n); }));
  };

  try {
    const data = await api("GET", "/posts/" + p.postId + "/comments");
    data.comments.forEach(add);
    if (!data.comments.length) list.append(el("div", { className: "meta", textContent: "No comments yet" }));
  } catch (e) { err.textContent = e.message; }

  const submit = async () => {
    const text = input.value.trim();
    if (!text) return;
    send.disabled = true; err.textContent = "";
    try {
      const c = await api("POST", "/posts/" + p.postId + "/comments", { text });
      if (n === 0) list.replaceChildren();
      add(c);
      input.value = "";
    } catch (e) { err.textContent = e.message; }
    send.disabled = false;
  };
  send.onclick = submit;
  input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
}

function commentRow(c, p, onRemoved) {
  const row = el("div", { className: "comment" });
  const likeBtn = el("button", {});
  const paint = () => {
    likeBtn.textContent = "\u2665 " + (c.likeCount || 0);
    likeBtn.className = c.likedByMe ? "on" : "";
  };
  paint();
  likeBtn.onclick = async () => {
    likeBtn.disabled = true;
    try {
      const r = await api(c.likedByMe ? "DELETE" : "PUT", "/posts/" + p.postId + "/comments/" + c.commentId + "/like");
      c.likedByMe = r.liked; c.likeCount = r.likeCount; paint();
    } catch (e) { alert(e.message); }
    likeBtn.disabled = false;
  };

  const mine = c.uid === state.user.uid;
  row.append(el("div", { className: "meta", textContent: (mine ? "You" : short(c.uid)) + " \u00b7 " + when(c.createdAt) }));
  if (c.text) row.append(el("div", { className: "text", textContent: c.text }));
  if (c.imageUrl) row.append(el("img", { src: c.imageUrl, loading: "lazy", alt: "" }));

  const bar = el("div", { className: "row" }, likeBtn);
  if (mine || p.authorUid === state.user.uid) {
    bar.append(el("button", {
      className: "del", textContent: "Delete",
      onclick: async () => {
        try {
          await api("DELETE", "/posts/" + p.postId + "/comments/" + c.commentId);
          row.remove(); onRemoved();
        } catch (e) { alert(e.message); }
      },
    }));
  }
  row.append(bar);
  return row;
}

/* ---------- Shorts ---------- */

async function loadShorts(first) {
  $("shortsErr").textContent = "";
  $("shortsMore").disabled = true;
  try {
    const q = "?limit=5" + (!first && state.shortsNext ? "&before=" + state.shortsNext : "");
    const data = await api("GET", "/shorts" + q);
    data.shorts.forEach((s) => $("shorts").append(shortCard(s)));
    if (first && data.shorts.length === 0) $("shorts").append(el("div", { className: "empty", textContent: "No shorts yet" }));
    state.shortsNext = data.nextBefore;
    $("shortsMore").classList.toggle("hidden", !state.shortsNext);
  } catch (e) {
    $("shortsErr").textContent = e.message;
    if (first) state.loaded.shorts = false;
  } finally {
    $("shortsMore").disabled = false;
  }
}

function shortCard(s) {
  const card = el("div", { className: "card" });
  const video = el("video", { src: s.videoUrl, controls: true, playsInline: true, preload: "metadata" });
  const viewsEl = el("span", { className: "meta" });
  const likeBtn = el("button", {});
  let counted = false;

  const paintViews = () => { viewsEl.textContent = s.views + " views"; };
  const paintLike = () => {
    likeBtn.textContent = "\u2665 " + s.likeCount;
    likeBtn.className = s.likedByMe ? "on" : "";
  };
  paintViews(); paintLike();

  video.addEventListener("play", async () => {
    if (counted) return;
    counted = true;
    try {
      const r = await api("POST", "/shorts/" + s.shortId + "/view");
      s.views = r.views; paintViews();
    } catch (e) {}
  });

  likeBtn.onclick = async () => {
    likeBtn.disabled = true;
    try {
      const r = await api(s.likedByMe ? "DELETE" : "PUT", "/shorts/" + s.shortId + "/like");
      s.likedByMe = r.liked; s.likeCount = r.likeCount; paintLike();
    } catch (e) { alert(e.message); }
    likeBtn.disabled = false;
  };

  const actions = el("div", { className: "actions" }, likeBtn, viewsEl);
  if (s.uploaderUid === state.user.uid) {
    actions.append(el("button", {
      className: "del", textContent: "Delete",
      onclick: async () => {
        if (!confirm("Delete this short?")) return;
        try { await api("DELETE", "/shorts/" + s.shortId); card.remove(); } catch (e) { alert(e.message); }
      },
    }));
  }

  card.append(
    el("div", { className: "text", textContent: s.title }),
    video,
    el("div", { className: "meta", textContent: short(s.uploaderUid) + " \u00b7 " + when(s.uploadedDate) }),
    actions
  );
  return card;
}

/* ---------- Mock ---------- */

async function loadSubjects() {
  $("mockErr").textContent = "";
  $("mockList").replaceChildren();
  try {
    const data = await api("GET", "/mocks");
    if (!data.subjects.length) {
      $("mockList").append(el("div", { className: "empty", textContent: "No mock questions yet" }));
      return;
    }
    data.subjects.forEach((s) => {
      $("mockList").append(el("button", {
        className: "subject",
        onclick: () => openSubject(s.subjectKey),
      }, el("span", { textContent: s.subject }), el("span", { className: "meta", textContent: s.questionCount + " questions" })));
    });
  } catch (e) {
    $("mockErr").textContent = e.message;
    state.loaded.mock = false;
  }
}

async function openSubject(key) {
  $("mockErr").textContent = "";
  try {
    const data = await api("GET", "/mocks/" + key);
    $("mockList").classList.add("hidden");
    renderQuiz(data);
  } catch (e) { $("mockErr").textContent = e.message; }
}

function renderQuiz(data) {
  const quiz = $("mockQuiz");
  quiz.replaceChildren();
  quiz.classList.remove("hidden");

  const canEdit = ["professor", "moderator"].includes(String(state.user.role).toLowerCase());
  let total = data.questions.length, answered = 0, correct = 0;

  const score = el("div", { className: "card score" });
  const paint = () => { score.textContent = data.subject + " \u00b7 Score " + correct + " / " + answered + " answered \u00b7 " + total + " questions"; };
  paint();

  const back = el("button", {
    textContent: "\u2190 Subjects",
    onclick: () => {
      quiz.classList.add("hidden"); quiz.replaceChildren();
      $("mockList").classList.remove("hidden");
      loadSubjects();
    },
  });
  quiz.append(el("div", { style: "margin-bottom:12px" }, back), score);

  data.questions.forEach((q, i) => {
    const card = el("div", { className: "card" });
    let done = false, won = false;
    card.append(el("div", { className: "meta", textContent: "Question " + (i + 1) }));
    card.append(el("div", { className: "text", textContent: q.question }));
    if (q.photos.length) card.append(el("div", { className: "imgs" }, q.photos.map((u) => el("img", { src: u, loading: "lazy", alt: "" }))));

    const buttons = q.options.map((text, idx) => {
      const b = el("button", { className: "opt", textContent: "ABCD"[idx] + ".  " + text });
      b.onclick = () => {
        if (done) return;
        done = true; answered++;
        if (idx === q.answerIndex) { correct++; won = true; b.classList.add("right"); }
        else { b.classList.add("wrong"); buttons[q.answerIndex].classList.add("right"); }
        paint();
      };
      return b;
    });
    card.append(...buttons);

    if (canEdit) {
      card.append(el("div", { className: "actions" }, el("button", {
        className: "del", textContent: "Delete question",
        onclick: async () => {
          if (!confirm("Delete this question?")) return;
          try {
            await api("DELETE", "/mocks/" + data.subjectKey + "/" + q.questionId);
            card.remove(); total--; if (done) answered--; if (won) correct--; paint();
          } catch (e) { alert(e.message); }
        },
      })));
    }
    quiz.append(card);
  });
}

/* ---------- Init ---------- */

$("loginBtn").onclick = login;
$("logoutBtn").onclick = logout;
$("feedMore").onclick = () => loadFeed(false);
$("shortsMore").onclick = () => loadShorts(false);
$("password").onkeydown = (e) => { if (e.key === "Enter") login(); };
document.querySelectorAll("#tabs button").forEach((b) => { b.onclick = () => openTab(b.dataset.tab); });

$("base").value = load("base") || DEFAULT_BASE;
$("email").value = load("email") || "";
const saved = load("user");
if (load("email") && load("password") && saved) {
  try {
    state.base = load("base") || DEFAULT_BASE;
    state.email = load("email");
    state.password = load("password");
    state.user = JSON.parse(saved);
    showApp();
  } catch (e) { logout(); }
}
</script>
</body>
</html>
