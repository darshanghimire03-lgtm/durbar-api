<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durbar API Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4f5f7;
    color: #1c1e21;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  h2 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; font-size: 13px; color: #555; margin: 8px 0 4px; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccd0d5;
    border-radius: 8px;
    font-size: 14px;
  }
  input[type=file] { width: 100%; font-size: 14px; margin: 4px 0 10px; }
  button {
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: #1a73e8;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button.secondary { background: #e4e6eb; color: #1c1e21; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bar { height: 8px; background: #e4e6eb; border-radius: 4px; overflow: hidden; margin-top: 10px; display: none; }
  .bar div { height: 100%; width: 0; background: #1a73e8; transition: width .1s; }
  .status { font-size: 13px; margin-top: 8px; word-break: break-word; }
  .ok { color: #137333; }
  .err { color: #c5221f; }
  .out { margin-top: 10px; display: none; }
  .out code {
    display: block;
    background: #f1f3f4;
    padding: 8px;
    border-radius: 8px;
    font-size: 12px;
    word-break: break-all;
    margin: 4px 0;
  }
  .out img, .out video { max-width: 100%; border-radius: 8px; margin-top: 8px; }
  .out a { font-size: 13px; }
  .hint { font-size: 12px; color: #777; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Durbar API Test</h1>

  <div class="card">
    <h2>Settings</h2>
    <label for="base">API URL (Render)</label>
    <input type="text" id="base" value="https://durbar-api-1.onrender.com">
    <label for="key">API key (only if UPLOAD_API_KEY is set)</label>
    <input type="password" id="key" placeholder="leave empty if not used">
    <div class="row" style="margin-top:12px">
      <button id="ping">Check server</button>
      <span class="status" id="pingStatus"></span>
    </div>
    <div class="hint">The first request after idle can take up to a minute on Render's free tier.</div>
  </div>

  <div class="card" data-type="image">
    <h2>Image</h2>
    <input type="file" accept="image/*">
    <button class="send">Upload image</button>
    <div class="bar"><div></div></div>
    <div class="status"></div>
    <div class="out"></div>
  </div>

  <div class="card" data-type="video">
    <h2>Video</h2>
    <input type="file" accept="video/*">
    <button class="send">Upload video</button>
    <div class="bar"><div></div></div>
    <div class="status"></div>
    <div class="out"></div>
  </div>

  <div class="card" data-type="file">
    <h2>File</h2>
    <input type="file">
    <button class="send">Upload file</button>
    <div class="bar"><div></div></div>
    <div class="status"></div>
    <div class="out"></div>
  </div>
</div>

<script>
  const baseInput = document.getElementById("base");
  const keyInput = document.getElementById("key");
  const pingBtn = document.getElementById("ping");
  const pingStatus = document.getElementById("pingStatus");

  function baseUrl() {
    return baseInput.value.trim().replace(/\/+$/, "");
  }

  function setStatus(el, text, cls) {
    el.textContent = text;
    el.className = "status" + (cls ? " " + cls : "");
  }

  function formatSize(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }

  pingBtn.onclick = async () => {
    pingBtn.disabled = true;
    setStatus(pingStatus, "Checking...", "");
    const start = Date.now();
    try {
      const res = await fetch(baseUrl() + "/");
      const data = await res.json();
      const ms = Date.now() - start;
      if (res.ok && data.ok) setStatus(pingStatus, "Server OK (" + ms + " ms)", "ok");
      else setStatus(pingStatus, "Unexpected response", "err");
    } catch (e) {
      setStatus(pingStatus, "Cannot reach server: " + e.message, "err");
    }
    pingBtn.disabled = false;
  };

  function renderResult(out, type, url, file) {
    out.innerHTML = "";

    const label = document.createElement("div");
    label.textContent = "Custom URL";
    const code = document.createElement("code");
    code.textContent = url;

    const meta = document.createElement("div");
    meta.className = "hint";
    meta.textContent = file.name + " · " + formatSize(file.size);

    const row = document.createElement("div");
    row.className = "row";
    const copy = document.createElement("button");
    copy.className = "secondary";
    copy.textContent = "Copy URL";
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(url);
        copy.textContent = "Copied";
        setTimeout(() => (copy.textContent = "Copy URL"), 1500);
      } catch (e) {
        copy.textContent = "Copy failed";
      }
    };
    const open = document.createElement("a");
    open.href = url;
    open.target = "_blank";
    open.rel = "noopener";
    open.textContent = "Open link";
    row.append(copy, open);

    out.append(label, code, meta, row);

    if (type === "image") {
      const img = document.createElement("img");
      img.src = url;
      img.alt = file.name;
      out.append(img);
    } else if (type === "video") {
      const v = document.createElement("video");
      v.src = url;
      v.controls = true;
      out.append(v);
    }
    out.style.display = "block";
  }

  document.querySelectorAll(".card[data-type]").forEach((card) => {
    const type = card.dataset.type;
    const fileInput = card.querySelector("input[type=file]");
    const btn = card.querySelector(".send");
    const bar = card.querySelector(".bar");
    const fill = bar.firstElementChild;
    const status = card.querySelector(".status");
    const out = card.querySelector(".out");

    btn.onclick = () => {
      const file = fileInput.files[0];
      if (!file) {
        setStatus(status, "Choose a file first", "err");
        return;
      }

      const form = new FormData();
      form.append("file", file);

      const xhr = new XMLHttpRequest();
      xhr.open("POST", baseUrl() + "/upload/" + type);
      xhr.timeout = 10 * 60 * 1000;
      const key = keyInput.value.trim();
      if (key) xhr.setRequestHeader("X-API-Key", key);

      btn.disabled = true;
      out.style.display = "none";
      bar.style.display = "block";
      fill.style.width = "0";
      setStatus(status, "Uploading " + file.name + " (" + formatSize(file.size) + ")...", "");

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          fill.style.width = pct + "%";
          setStatus(status, pct === 100 ? "Processing on provider..." : "Uploading " + pct + "%", "");
        }
      };

      xhr.onload = () => {
        btn.disabled = false;
        let data = {};
        try {
          data = JSON.parse(xhr.responseText);
        } catch (e) {}
        if (xhr.status >= 200 && xhr.status < 300 && data.url) {
          setStatus(status, "Upload complete", "ok");
          renderResult(out, type, data.url, file);
        } else {
          setStatus(status, "Failed (" + xhr.status + "): " + (data.detail || "REQUEST_FAILED"), "err");
        }
      };

      xhr.onerror = () => {
        btn.disabled = false;
        setStatus(status, "Network error. Check the API URL and that the server is awake.", "err");
      };

      xhr.ontimeout = () => {
        btn.disabled = false;
        setStatus(status, "Timed out", "err");
      };

      xhr.send(form);
    };
  });
</script>
</body>
</html>
