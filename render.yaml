services:
  - type: web
    name: durbar-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://darbarhigh-4c642-default-rtdb.firebaseio.com
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: INVITE_BASE_URL
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: CLOUDINARY_DOCS_CLOUD
        value: ddgpgkjpz
      - key: CLOUDINARY_DOCS_PRESET
        value: Durbar
      - key: CLOUDINARY_SHORTS_CLOUD
        value: qo3uznog
      - key: CLOUDINARY_SHORTS_PRESET
        value: Durbar Shorts
      - key: AI_BASE_URL
        value: https://durbar-ai-1.onrender.com
      - key: CORS_ORIGINS
        value: ""