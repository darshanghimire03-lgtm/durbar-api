<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durbar Test</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --card:#fff; --text:#1d2129; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b22; --text:#e8eaed; --muted:#9aa0aa; --line:#2a2e38; --accent:#60a5fa; --danger:#f87171; --ok:#4ade80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:17px; margin:0 0 8px; }
  input, textarea, button { font:inherit; }
  input[type=text], input[type=email], input[type=password], input[type=url], textarea {
    width:100%; padding:10px 12px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--text);
  }
  textarea { resize:vertical; min-height:70px; }
  button { cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--text); padding:7px 12px; border-radius:8px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  button.on { color:var(--danger); border-color:var(--danger); }
  button.del { color:var(--danger); }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .bar .who { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav { display:flex; gap:6px; margin-bottom:14px; position:sticky; top:0; padding:8px 0; background:var(--bg); z-index:5; }
  .nav button { flex:1; padding:9px 2px; font-size:13px; }
  .nav button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .meta { color:var(--muted); font-size:13px; }
  .text { white-space:pre-wrap; word-break:break-word; margin:8px 0; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:6px; margin:8px 0; }
  .imgs img { width:100%; border-radius:8px; display:block; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .comments { margin-top:12px; border-top:1px solid var(--line); padding-top:12px; }
  .comment { padding:8px 0; border-bottom:1px solid var(--line); }
  .comment:last-of-type { border-bottom:0; }
  .comment .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  .comment img { max-width:200px; border-radius:8px; display:block; margin-top:6px; }
  .send { display:flex; gap:8px; margin-top:10px; }
  .send input { margin:0; flex:1; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin:4px 0; }
  .empty { text-align:center; color:var(--muted); padding:20px; }
  .hidden { display:none; }
  .center { text-align:center; margin-bottom:14px; }
  video { width:100%; max-height:70vh; border-radius:8px; background:#000; display:block; margin:8px 0; }
  .subject { display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; }
  .opt { display:block; width:100%; text-align:left; margin-top:8px; padding:10px 12px; }
  .opt.ok { border-color:var(--ok); color:var(--ok); }
  .opt.bad { border-color:var(--danger); color:var(--danger); }
  .score { font-size:28px; font-weight:600; margin:8px 0; }
  .profile-head { display:flex; gap:14px; align-items:center; margin-bottom:12px; }
  .avatar { width:72px; height:72px; border-radius:50%; object-fit:cover; background:var(--line); flex:none; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); }
  .kv span:first-child { color:var(--muted); }
  .kv span:last-child { text-align:right; word-break:break-all; }
  .link { display:flex; align-items:center; gap:10px; padding:8px 10px; margin-top:6px; border:1px solid var(--line); border-radius:8px; color:var(--accent); text-decoration:none; word-break:break-word; }
  .link .meta { margin-left:auto; flex:none; }
  .yt { display:flex; gap:10px; align-items:center; margin-top:6px; color:var(--text); text-decoration:none; }
  .yt img { width:120px; border-radius:6px; flex:none; display:block; }
  .section-title { font-size:13px; color:var(--muted); margin-top:12px; text-transform:uppercase; letter-spacing:.04em; }
  .crumb { margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="card">
    <h1>Login</h1>
    <input id="base" type="url" placeholder="API base URL" autocomplete="off">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <div id="loginErr" class="err"></div>
    <button id="loginBtn" class="primary">Log in</button>
  </div>

  <div id="appView" class="hidden">
    <div class="bar">
      <div class="who" id="who"></div>
      <button id="logoutBtn">Log out</button>
    </div>

    <div class="nav">
      <button id="nav-feed">Feed</button>
      <button id="nav-shorts">Shorts</button>
      <button id="nav-mock">Mock</button>
      <button id="nav-subjects">Subjects</button>
      <button id="nav-profile">Profile</button>
    </div>

    <div id="tab-feed">
      <div id="feedErr" class="err"></div>
      <div id="feed"></div>
      <div class="center"><button id="moreBtn" class="hidden">Load more</button></div>
    </div>

    <div id="tab-shorts" class="hidden">
      <div id="shortsErr" class="err"></div>
      <div id="shorts"></div>
      <div class="center"><button id="moreShorts" class="hidden">Load more</button></div>
    </div>

    <div id="tab-mock" class="hidden">
      <div id="mockErr" class="err"></div>
      <div id="mock"></div>
    </div>

    <div id="tab-subjects" class="hidden">
      <div id="subjectsErr" class="err"></div>
      <div id="subjectsBox"></div>
    </div>

    <div id="tab-profile" class="hidden">
      <div id="profile"></div>
    </div>
  </div>

</div>

<script>
const DEFAULT_BASE = "https://durbar-api-1.onrender.com";
const SUPER_EMAIL = "darshanghimire03@gmail.com";
const $ = (id) => document.getElementById(id);
const state = { base: "", email: "", password: "", user: null, next: null, nextShort: null };
const TABS = ["feed", "shorts", "mock", "subjects", "profile"];
const CONTAINERS = ["feed", "shorts", "mock", "subjectsBox", "profile"];
const loaded = {};

function store(key, value) {
  try { value === null ? sessionStorage.removeItem(key) : sessionStorage.setItem(key, value); } catch (e) {}
}
function load(key) {
  try { return sessionStorage.getItem(key); } catch (e) { return null; }
}

async function api(method, path, body) {
  const headers = { "X-Email": state.email, "X-Password": state.password };
  const opts = { method, headers };
  if (body !== undefined) {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(state.base + path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401) { logout(); }
    const d = data && data.detail;
    throw new Error(typeof d === "string" ? d : "Request failed (" + res.status + ")");
  }
  return data;
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props || {});
  kids.flat().forEach((k) => n.append(k));
  return n;
}

function when(ms) {
  return ms ? new Date(ms).toLocaleString() : "";
}

function short(uid) {
  return uid ? "user " + uid.slice(0, 6) : "unknown";
}

function fmtSize(bytes) {
  if (!bytes) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
  return (bytes / 1024 / 1024).toFixed(1) + " MB";
}

function keyOf(text) {
  return String(text || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40);
}

function canManage(subjectKey) {
  const u = state.user || {};
  if (String(u.email || "").trim().toLowerCase() === SUPER_EMAIL) return true;
  const role = String(u.role || "").trim().toLowerCase();
  if (role === "professor") return true;
  if (role === "moderator") return keyOf(u.assignedSubject) === subjectKey;
  return false;
}

async function login() {
  const base = $("base").value.trim().replace(/\/+$/, "");
  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  $("loginErr").textContent = "";
  if (!base || !email || !password) { $("loginErr").textContent = "Fill in all fields"; return; }
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "Logging in... (server may be waking up)";
  try {
    const res = await fetch(base + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const d = data && data.detail;
      throw new Error(typeof d === "string" ? d : "Login failed (" + res.status + ")");
    }
    state.base = base; state.email = email; state.password = password; state.user = data;
    store("base", base); store("email", email); store("password", password);
    store("user", JSON.stringify(data));
    $("password").value = "";
    showApp();
  } catch (e) {
    $("loginErr").textContent = e.message === "Failed to fetch" ? "Cannot reach the server" : e.message;
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "Log in";
  }
}

function logout() {
  ["base", "email", "password", "user"].forEach((k) => store(k, null));
  state.email = ""; state.password = ""; state.user = null; state.next = null; state.nextShort = null;
  pauseVideos();
  CONTAINERS.forEach((id) => $(id).replaceChildren());
  ["feedErr", "shortsErr", "mockErr", "subjectsErr"].forEach((id) => { $(id).textContent = ""; });
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
}

function showApp() {
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("who").textContent = (state.user.fullName || state.user.email) + " (" + state.user.role + ")";
  CONTAINERS.forEach((id) => $(id).replaceChildren());
  TABS.forEach((t) => { loaded[t] = false; });
  state.next = null; state.nextShort = null;
  openTab("feed");
}

function pauseVideos() {
  document.querySelectorAll("video").forEach((v) => v.pause());
}

const loaders = {
  feed: () => loadFeed(true),
  shorts: () => loadShorts(true),
  mock: () => loadSubjects(),
  subjects: () => loadSubjectTab(),
  profile: () => renderProfile(),
};

function openTab(name) {
  pauseVideos();
  TABS.forEach((t) => {
    $("tab-" + t).classList.toggle("hidden", t !== name);
    $("nav-" + t).classList.toggle("active", t === name);
  });
  if (!loaded[name]) { loaded[name] = true; loaders[name](); }
}

/* ---------- Feed ---------- */

async function loadFeed(first) {
  $("feedErr").textContent = "";
  $("moreBtn").disabled = true;
  try {
    const q = "?limit=10" + (!first && state.next ? "&before=" + state.next : "");
    const data = await api("GET", "/posts" + q);
    data.posts.forEach((p) => $("feed").append(postCard(p)));
    if (first && data.posts.length === 0) $("feed").append(el("div", { className: "empty", textContent: "No posts yet" }));
    state.next = data.nextBefore;
    $("moreBtn").classList.toggle("hidden", !state.next);
  } catch (e) {
    $("feedErr").textContent = e.message;
  } finally {
    $("moreBtn").disabled = false;
  }
}

function postCard(p) {
  const card = el("div", { className: "card" });
  const likeBtn = el("button", {});
  const cBtn = el("button", {});
  const box = el("div", { className: "comments hidden" });
  let loadedC = false;
  let count = p.commentCount;

  const paintLike = () => {
    likeBtn.textContent = "\u2665 " + p.likeCount;
    likeBtn.className = p.likedByMe ? "on" : "";
  };
  const paintCount = () => { cBtn.textContent = "Comments (" + count + ")"; };
  paintLike(); paintCount();

  likeBtn.onclick = async () => {
    likeBtn.disabled = true;
    try {
      const r = await api(p.likedByMe ? "DELETE" : "PUT", "/posts/" + p.postId + "/like");
      p.likedByMe = r.liked; p.likeCount = r.likeCount; paintLike();
    } catch (e) { alert(e.message); }
    likeBtn.disabled = false;
  };

  cBtn.onclick = async () => {
    box.classList.toggle("hidden");
    if (!loadedC && !box.classList.contains("hidden")) {
      loadedC = true;
      await buildComments(box, p, (n) => { count = n; paintCount(); });
    }
  };

  const actions = el("div", { className: "actions" }, likeBtn, cBtn);
  if (p.authorUid === state.user.uid) {
    actions.append(el("button", {
      className: "del", textContent: "Delete",
      onclick: async () => {
        if (!confirm("Delete this post?")) return;
        try { await api("DELETE", "/posts/" + p.postId); card.remove(); } catch (e) { alert(e.message); }
      },
    }));
  }

  card.append(el("div", { className: "meta", textContent: (p.authorEmail || short(p.authorUid)) + " \u00b7 " + when(p.createdAt) + (p.privacy === "section" ? " \u00b7 Section " + p.section : "") }));
  if (p.text) card.append(el("div", { className: "text", textContent: p.text }));
  if (p.imageUrls && p.imageUrls.length) {
    card.append(el("div", { className: "imgs" }, p.imageUrls.map((u) => el("img", { src: u, loading: "lazy", alt: "" }))));
  }
  card.append(actions, box);
  return card;
}

async function buildComments(box, p, setCount) {
  const list = el("div", {});
  const err = el("div", { className: "err" });
  const input = el("input", { type: "text", placeholder: "Write a comment...", maxLength: 1000 });
  const send = el("button", { className: "primary", textContent: "Send" });
  const form = el("div", { className: "send" }, input, send);
  box.append(list, err, form);

  let n = 0;
  const add = (c) => {
    n++; setCount(n);
    list.append(commentRow(c, p, () => { n--; setCount(n); }));
  };

  try {
    const data = await api("GET", "/posts/" + p.postId + "/comments");
    data.comments.forEach(add);
    if (!data.comments.length) list.append(el("div", { className: "meta", textContent: "No comments yet" }));
  } catch (e) { err.textContent = e.message; }

  const submit = async () => {
    const text = input.value.trim();
    if (!text) return;
    send.disabled = true; err.textContent = "";
    try {
      const c = await api("POST", "/posts/" + p.postId + "/comments", { text });
      if (n === 0) list.replaceChildren();
      add(c);
      input.value = "";
    } catch (e) { err.textContent = e.message; }
    send.disabled = false;
  };
  send.onclick = submit;
  input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
}

function commentRow(c, p, onRemoved) {
  const row = el("div", { className: "comment" });
  const likeBtn = el("button", {});
  const paint = () => {
    likeBtn.textContent = "\u2665 " + (c.likeCount || 0);
    likeBtn.className = c.likedByMe ? "on" : "";
  };
  paint();
  likeBtn.onclick = async () => {
    likeBtn.disabled = true;
    try {
      const r = await api(c.likedByMe ? "DELETE" : "PUT", "/posts/" + p.postId + "/comments/" + c.commentId + "/like");
      c.likedByMe = r.liked; c.likeCount = r.likeCount; paint();
    } catch (e) { alert(e.message); }
    likeBtn.disabled = false;
  };

  const mine = c.uid === state.user.uid;
  row.append(el("div", { className: "meta", textContent: (mine ? "You" : short(c.uid)) + " \u00b7 " + when(c.createdAt) }));
  if (c.text) row.append(el("div", { className: "text", textContent: c.text }));
  if (c.imageUrl) row.append(el("img", { src: c.imageUrl, loading: "lazy", alt: "" }));

  const bar = el("div", { className: "row" }, likeBtn);
  if (mine || p.authorUid === state.user.uid) {
    bar.append(el("button", {
      className: "del", textContent: "Delete",
      onclick: async () => {
        try {
          await api("DELETE", "/posts/" + p.postId + "/comments/" + c.commentId);
          row.remove(); onRemoved();
        } catch (e) { alert(e.message); }
      },
    }));
  }
  row.append(bar);
  return row;
}

/* ---------- Shorts ---------- */

async function loadShorts(first) {
  $("shortsErr").textContent = "";
  $("moreShorts").disabled = true;
  try {
    const q = "?limit=5" + (!first && state.nextShort ? "&before=" + state.nextShort : "");
    const data = await api("GET", "/shorts" + q);
    data.shorts.forEach((s) => $("shorts").append(shortCard(s)));
    if (first && data.shorts.length === 0) $("shorts").append(el("div", { className: "empty", textContent: "No shorts yet" }));
    state.nextShort = data.nextBefore;
    $("moreShorts").classList.toggle("hidden", !state.nextShort);
  } catch (e) {
    $("shortsErr").textContent = e.message;
  } finally {
    $("moreShorts").disabled = false;
  }
}

function shortCard(s) {
  const card = el("div", { className: "card" });
  const info = el("div", { className: "meta" });
  const likeBtn = el("button", {});
  let counted = false;

  const paintInfo = () => {
    info.textContent = (s.uploaderUid === state.user.uid ? "You" : short(s.uploaderUid)) + " \u00b7 " + when(s.uploadedDate) + " \u00b7 " + s.views + " views";
  };
  const paintLike = () => {
    likeBtn.textContent = "\u2665 " + s.likeCount;
    likeBtn.className = s.likedByMe ? "on" : "";
  };
  paintInfo(); paintLike();

  const video = el("video", { src: s.videoUrl, controls: true, preload: "metadata", playsInline: true });
  video.onplay = async () => {
    document.querySelectorAll("video").forEach((v) => { if (v !== video) v.pause(); });
    if (counted) return;
    counted = true;
    try {
      const r = await api("POST", "/shorts/" + s.shortId + "/view");
      s.views = r.views; paintInfo();
    } catch (e) {}
  };

  likeBtn.onclick = async () => {
    likeBtn.disabled = true;
    try {
      const r = await api(s.likedByMe ? "DELETE" : "PUT", "/shorts/" + s.shortId + "/like");
      s.likedByMe = r.liked; s.likeCount = r.likeCount; paintLike();
    } catch (e) { alert(e.message); }
    likeBtn.disabled = false;
  };

  const actions = el("div", { className: "actions" }, likeBtn);
  if (s.uploaderUid === state.user.uid) {
    actions.append(el("button", {
      className: "del", textContent: "Delete",
      onclick: async () => {
        if (!confirm("Delete this short?")) return;
        try { await api("DELETE", "/shorts/" + s.shortId); card.remove(); } catch (e) { alert(e.message); }
      },
    }));
  }

  card.append(el("h2", { textContent: s.title }), video, info, actions);
  return card;
}

/* ---------- Mock ---------- */

async function loadSubjects() {
  $("mockErr").textContent = "";
  $("mock").replaceChildren(el("div", { className: "empty", textContent: "Loading..." }));
  try {
    const data = await api("GET", "/mocks");
    $("mock").replaceChildren();
    if (!data.subjects.length) {
      $("mock").append(el("div", { className: "empty", textContent: "No mock tests yet" }));
      return;
    }
    data.subjects.forEach((s) => {
      $("mock").append(el("div", { className: "card subject", onclick: () => openSubject(s) },
        el("div", {}, el("h2", { textContent: s.subject }), el("div", { className: "meta", textContent: s.questionCount + " questions" })),
        el("button", { className: "primary", textContent: "Start" })
      ));
    });
  } catch (e) {
    $("mock").replaceChildren();
    $("mockErr").textContent = e.message;
  }
}

async function openSubject(s) {
  $("mockErr").textContent = "";
  $("mock").replaceChildren(el("div", { className: "empty", textContent: "Loading..." }));
  try {
    const data = await api("GET", "/mocks/" + s.subjectKey);
    if (!data.questions.length) throw new Error("This subject has no questions");
    runQuiz(data);
  } catch (e) {
    $("mockErr").textContent = e.message;
    loadSubjects();
  }
}

function runQuiz(data) {
  const qs = data.questions;
  let idx = 0, score = 0;

  const back = () => loadSubjects();

  const render = () => {
    const q = qs[idx];
    let answered = false;
    const next = el("button", { className: "primary hidden", textContent: idx === qs.length - 1 ? "Finish" : "Next" });
    const opts = q.options.map((text, i) => {
      const b = el("button", { className: "opt", textContent: text });
      b.onclick = () => {
        if (answered) return;
        answered = true;
        if (i === q.answerIndex) { score++; b.classList.add("ok"); }
        else { b.classList.add("bad"); opts[q.answerIndex].classList.add("ok"); }
        next.classList.remove("hidden");
      };
      return b;
    });
    next.onclick = () => { idx++; idx < qs.length ? render() : finish(); };

    const card = el("div", { className: "card" },
      el("div", { className: "meta", textContent: data.subject + " \u00b7 Question " + (idx + 1) + " of " + qs.length }),
      el("div", { className: "text", textContent: q.question })
    );
    if (q.photos && q.photos.length) {
      card.append(el("div", { className: "imgs" }, q.photos.map((u) => el("img", { src: u, loading: "lazy", alt: "" }))));
    }
    card.append(...opts, el("div", { className: "actions" }, next, el("button", { textContent: "Quit", onclick: back })));
    $("mock").replaceChildren(card);
  };

  const finish = () => {
    $("mock").replaceChildren(el("div", { className: "card center" },
      el("h2", { textContent: data.subject }),
      el("div", { className: "score", textContent: score + " / " + qs.length }),
      el("div", { className: "meta", textContent: Math.round((score / qs.length) * 100) + "% correct" }),
      el("div", { className: "actions", style: "justify-content:center" },
        el("button", { className: "primary", textContent: "Retry", onclick: () => { idx = 0; score = 0; render(); } }),
        el("button", { textContent: "Back to subjects", onclick: back })
      )
    ));
  };

  render();
}

/* ---------- Subjects ---------- */

function crumb(label, fn) {
  return el("div", { className: "crumb" }, el("button", { textContent: "\u2190 " + label, onclick: fn }));
}

async function loadSubjectTab() {
  $("subjectsErr").textContent = "";
  $("subjectsBox").replaceChildren(el("div", { className: "empty", textContent: "Loading..." }));
  try {
    const data = await api("GET", "/subjects");
    $("subjectsBox").replaceChildren();
    data.subjects.forEach((s) => {
      $("subjectsBox").append(el("div", { className: "card subject", onclick: () => openUnits(s) },
        el("div", {}, el("h2", { textContent: s.name }), el("div", { className: "meta", textContent: s.unitCount + " units" })),
        el("span", { className: "meta", textContent: "\u203a" })
      ));
    });
  } catch (e) {
    $("subjectsBox").replaceChildren();
    $("subjectsErr").textContent = e.message;
  }
}

async function openUnits(s) {
  $("subjectsErr").textContent = "";
  $("subjectsBox").replaceChildren(el("div", { className: "empty", textContent: "Loading..." }));
  try {
    const data = await api("GET", "/subjects/" + s.subjectKey + "/units");
    const box = $("subjectsBox");
    box.replaceChildren(crumb("Subjects", loadSubjectTab), el("h2", { textContent: data.subject }));

    if (!data.units.length) box.append(el("div", { className: "empty", textContent: "No units yet" }));
    data.units.forEach((u) => {
      const row = el("div", { className: "card subject", onclick: () => openUnit(s, u) },
        el("div", {},
          el("h2", { textContent: u.name }),
          el("div", { className: "meta", textContent: u.noteCount + " notes \u00b7 by " + (u.createdByRole || "unknown") })
        )
      );
      if (canManage(s.subjectKey)) {
        row.append(el("button", {
          className: "del", textContent: "Delete",
          onclick: async (ev) => {
            ev.stopPropagation();
            if (!confirm("Delete unit \"" + u.name + "\" and all its notes?")) return;
            try { await api("DELETE", "/subjects/" + s.subjectKey + "/units/" + u.id); openUnits(s); }
            catch (e) { $("subjectsErr").textContent = e.message; }
          },
        }));
      } else {
        row.append(el("span", { className: "meta", textContent: "\u203a" }));
      }
      box.append(row);
    });

    if (canManage(s.subjectKey)) {
      const input = el("input", { type: "text", placeholder: "New unit name", maxLength: 100 });
      const add = el("button", { className: "primary", textContent: "Add unit" });
      add.onclick = async () => {
        const name = input.value.trim();
        if (!name) return;
        add.disabled = true;
        try { await api("POST", "/subjects/" + s.subjectKey + "/units", { name }); openUnits(s); }
        catch (e) { $("subjectsErr").textContent = e.message; add.disabled = false; }
      };
      box.append(el("div", { className: "card" }, el("h2", { textContent: "Add a unit" }), input, add));
    }
  } catch (e) {
    $("subjectsErr").textContent = e.message;
    loadSubjectTab();
  }
}

async function openUnit(s, u) {
  $("subjectsErr").textContent = "";
  $("subjectsBox").replaceChildren(el("div", { className: "empty", textContent: "Loading..." }));
  try {
    const data = await api("GET", "/subjects/" + s.subjectKey + "/units/" + u.id);
    const box = $("subjectsBox");
    box.replaceChildren(
      crumb(s.name, () => openUnits(s)),
      el("h2", { textContent: data.name }),
      el("div", { className: "meta", textContent: data.subject + " \u00b7 " + data.noteCount + " notes" })
    );

    if (!data.notes.length) box.append(el("div", { className: "empty", textContent: "No notes yet" }));
    data.notes.forEach((n) => box.append(noteCard(s, u, n)));

    if (canManage(s.subjectKey)) {
      const title = el("input", { type: "text", placeholder: "Title", maxLength: 150 });
      const desc = el("textarea", { placeholder: "Description" });
      const links = el("textarea", { placeholder: "YouTube links, one per line" });
      const add = el("button", { className: "primary", textContent: "Add note" });
      add.onclick = async () => {
        const t = title.value.trim();
        if (!t) { $("subjectsErr").textContent = "Title is required"; return; }
        const youtubeLinks = links.value.split("\n").map((x) => x.trim()).filter(Boolean).map((url) => ({ url }));
        add.disabled = true;
        try {
          await api("POST", "/subjects/" + s.subjectKey + "/units/" + u.id + "/notes", {
            title: t, description: desc.value.trim(), youtubeLinks,
          });
          openUnit(s, u);
        } catch (e) { $("subjectsErr").textContent = e.message; add.disabled = false; }
      };
      box.append(el("div", { className: "card" },
        el("h2", { textContent: "Add a note" }), title, desc, links, add,
        el("div", { className: "meta", textContent: "PDFs and photos need uploads, so add those through the API." })
      ));
    }
  } catch (e) {
    $("subjectsErr").textContent = e.message;
    openUnits(s);
  }
}

function noteCard(s, u, n) {
  const card = el("div", { className: "card" });
  card.append(
    el("h2", { textContent: n.title }),
    el("div", { className: "meta", textContent: when(n.createdAt) })
  );
  if (n.description) card.append(el("div", { className: "text", textContent: n.description }));

  if (n.photos.length) {
    card.append(el("div", { className: "imgs" }, n.photos.map((p) => el("img", { src: p.url, loading: "lazy", alt: "" }))));
  }

  if (n.pdfs.length) {
    card.append(el("div", { className: "section-title", textContent: "PDFs" }));
    n.pdfs.forEach((p) => {
      card.append(el("a", { className: "link", href: p.url, target: "_blank", rel: "noopener" },
        el("span", { textContent: "\ud83d\udcc4 " + (p.name || "PDF") }),
        el("span", { className: "meta", textContent: fmtSize(p.sizeBytes) })
      ));
    });
  }

  if (n.youtubeLinks.length) {
    card.append(el("div", { className: "section-title", textContent: "Videos" }));
    n.youtubeLinks.forEach((y) => {
      card.append(el("a", { className: "yt", href: y.url, target: "_blank", rel: "noopener" },
        el("img", { src: "https://img.youtube.com/vi/" + y.videoId + "/mqdefault.jpg", loading: "lazy", alt: "" }),
        el("span", { textContent: "Video " + y.videoNumber })
      ));
    });
  }

  if (canManage(s.subjectKey)) {
    card.append(el("div", { className: "actions" }, el("button", {
      className: "del", textContent: "Delete note",
      onclick: async () => {
        if (!confirm("Delete this note?")) return;
        try { await api("DELETE", "/subjects/" + s.subjectKey + "/units/" + u.id + "/notes/" + n.id); openUnit(s, u); }
        catch (e) { $("subjectsErr").textContent = e.message; }
      },
    })));
  }
  return card;
}

/* ---------- Profile ---------- */

function renderProfile() {
  const u = state.user;
  const head = el("div", { className: "profile-head" });
  if (u.profileImageUrl) head.append(el("img", { className: "avatar", src: u.profileImageUrl, alt: "" }));
  else head.append(el("div", { className: "avatar" }));
  head.append(el("div", {},
    el("h2", { textContent: u.fullName || u.email }),
    el("div", { className: "meta", textContent: u.role })
  ));

  const card = el("div", { className: "card" }, head);
  const fields = [
    ["Email", u.email],
    ["Phone", u.phone],
    ["Gender", u.gender],
    ["Assigned subject", u.assignedSubject],
    ["Class", u.classLevel],
    ["Section", u.section],
    ["Joined", when(u.createdAt)],
    ["User ID", u.uid],
  ];
  fields.forEach(([k, v]) => {
    if (v) card.append(el("div", { className: "kv" }, el("span", { textContent: k }), el("span", { textContent: String(v) })));
  });
  card.append(el("div", { className: "actions" }, el("button", { className: "del", textContent: "Log out", onclick: logout })));
  $("profile").replaceChildren(card);
}

/* ---------- Boot ---------- */

$("loginBtn").onclick = login;
$("logoutBtn").onclick = logout;
$("moreBtn").onclick = () => loadFeed(false);
$("moreShorts").onclick = () => loadShorts(false);
TABS.forEach((t) => { $("nav-" + t).onclick = () => openTab(t); });
$("password").onkeydown = (e) => { if (e.key === "Enter") login(); };

$("base").value = load("base") || DEFAULT_BASE;
$("email").value = load("email") || "";
const saved = load("user");
if (load("email") && load("password") && saved) {
  try {
    state.base = load("base") || DEFAULT_BASE;
    state.email = load("email");
    state.password = load("password");
    state.user = JSON.parse(saved);
    showApp();
  } catch (e) { logout(); }
}
</script>
</body>
</html>
